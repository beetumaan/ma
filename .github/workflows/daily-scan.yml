name: Daily Stock Scan

on:
  schedule:
    - cron: '30 22 * * *'   # 4:00 AM IST (22:30 UTC) every day
  workflow_dispatch:          # allow manual trigger from Actions tab

jobs:
  scan:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit stocks.json back to repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run stock scan
        run: python scripts/run_scan.py

      - name: Commit updated stocks.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/stocks.json
          git diff --staged --quiet \
            || git commit -m "data: daily scan $(date -u +'%Y-%m-%d %H:%M UTC')"
          git push
